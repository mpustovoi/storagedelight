modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT License"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    authors="${mod_authors}"
    description="${mod_description}"
    logoFile="assets/storagedelight/logo.png"

[[dependencies.storagedelight]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.storagedelight]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.storagedelight]]
    modId="everycomp"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

